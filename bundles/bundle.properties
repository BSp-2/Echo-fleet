# Planets

planet.aetheria.name = Aetheria
planet.kaltos.name = Kaltos

# Sectors

sector.echo-fleet-un.name = Un
sector.echo-fleet-un.description = You feel the air, rough yet oddly familiar...\nFar away from all the diffrent enemy bases, hostile environments and forsaken remnants lies this uncharted place.\nWeak patrols and an abundance of starting resourses make it a great starting point for your campaign... 

sector.echo-fleet-mollum.name = Mollum
sector.echo-fleet-mollum.description = This sector has withstood a multitude of volcanic eruptions. It used to be a plain that held large amounts of magnetic materials. However, due to the slag floods, a big amount of copper veins melted and turned into scrap metal overtime.\nUtilise[accent] Slag refineries [white]to produce copper without acquiring it through mining.

sector.echo-fleet-haign.name = Haign
sector.echo-fleet-haign.description = An abandoned extraction site. Withered by time, it lies lifeless here.\nUtilize new tech to acquire alluminum. 

sector.echo-fleet-pirc.name = Pirc
sector.echo-fleet-pirc.description = Scans detect this is a small sector with a strong bauxite concentration. \nThe enemy has set up a weak outpost here...

sector.echo-fleet-aysel.name = Aysel
sector.echo-fleet-aysel.description = This sector is mostly flooded with slag. Venture into advanced distribution. 

sector.echo-fleet-wadi.name = Wadi
sector.echo-fleet-wadi.description = Radars detect a big enemy base. Start upgrading your units. Research new crude oil tech. 

# Resources - Items
item.echo-fleet-efscrap.name = Scrap
item.echo-fleet-efscrap.description = Abundant material composed of many different metals.

item.echo-fleet-efcopper.name = Copper
item.echo-fleet-efcopper.description = Soft metal with small electric charge. Great at conducting power.

item.echo-fleet-efsoft-coal.name = Soft Coal
item.echo-fleet-efsoft-coal.description = Low quality type of coal. Acquired through refinement processes as a byproduct.

item.echo-fleet-efalluminum.name = Alluminum
item.echo-fleet-efalluminum.description = Charged and light, yet durable metal.

item.echo-fleet-efcupride.name = Cupride
item.echo-fleet-efcupride.description = Slightly charged resource acquired through oxidizing copper. Decently toxic. 

item.echo-fleet-efeuropium.name = Europium
item.echo-fleet-efeuropium.description = Charged and slightly radioactive metal. Has a strange structure that let's it both conduct and block electricity. 

item.echo-fleet-efpolycarbonate.name = Polycarbonate
item.echo-fleet-efpolycarbonate.description = Crude plastic synthesized from coal and LPGs. Great at reflecting impacts. 

item.echo-fleet-efsulphur.name = Sulphur
item.echo-fleet-efsulphur.description = Highly flammable and toxic powder. Great for thermal reactions. 

item.echo-fleet-efecho-shard.name = Echo Shard
item.echo-fleet-efecho-shard.description = Radioactive pile of metals infested with exotic nanomachines left behind by ancient civilisations. 

item.echo-fleet-efecho-circuit.name = Echo Circuit
item.echo-fleet-efecho-circuit.description = Electronic component dedicated to handling precise and complex tasks.

item.echo-fleet-efalluminum-polycarbonate.name = Alluminum Polycarbonate
item.echo-fleet-efalluminum-polycarbonate.description = Highly charged reinforced plastic. Greatly impact resistant.

item.echo-fleet-efresonance-matrix.name = Resonance Matrix
item.echo-fleet-efresonance-matrix.description = Horrible mess of molecules. Extremely radioactive and unstable, yet somehow unnaturaly durable at the same time.

# Resources - 

liquid.echo-fleet-efcrude-oil.name = Crude Oil
liquid.echo-fleet-efcrude-oil.description: Viscocious mass of carbon and flammable or corrosive components.

liquid.echo-fleet-efdirty-water.name = Contaminated Water
liquid.echo-fleet-efdirty-water.description = Seriously contaminated water. Barely does it's job as a coolant. Purification is basicaly mandatory.

liquid.echo-fleet-efpurified-water.name = Purified Water
liquid.echo-fleet-efpurified-water.description = Properly purificated water. Nothing special.

liquid.echo-fleet-efslag.name = Slag
liquid.echo-fleet-efslag.description = Molten mass of a variety of metals.

liquid.echo-fleet-eflpg.name = Liquid Petroleum Gas
liquid.echo-fleet-eflpg.description = Processed petroleum. Mostly used for plastic synthesis.

liquid.echo-fleet-efsulphuric-acid.name = Sulphuric Acid
liquid.echo-fleet-efsulphuric-acid.description = Extremely corrosive acid.

liquid.echo-fleet-efcarbon-dioxide.name = Carbon Dioxide
liquid.echo-fleet-efcarbon-dioxide.description = Smoke. Can be refined into basic components. Mostly useless.

liquid.echo-fleet-efozone.name = Ozone
liquid.echo-fleet-efozone.description = Combustible gas with oxidizing properties.

liquid.echo-fleet-efnitrogen.name = Nitrogen
liquid.echo-fleet-efnitrogen.description = Usualy cold gas. Useful as a coolant.

liquid.echo-fleet-efhydrogen-sulfide.name = Hydrogen Sulfide
liquid.echo-fleet-efhydrogen-sulfide.description = Corrosive sulfuric gas. Toxic.

liquid.echo-fleet-efhydrogen.name = Hydrogen
liquid.echo-fleet-efhydrogen.description = Slightly combustible. Frigid.

liquid.echo-fleet-efneutralizer.name = Neutralizer
liquid.echo-fleet-efneutralizer.description = Extremely slow to change temperature.

